# Seed the image-managed appliance Sway session. The user copy shadows
# /etc/sway/config.d entirely, so copy the canonical config on first boot
# only (C never overwrites); later updates are deployed live or migrated.
d /var/games/home/.config/sway 0755 ultramarine ultramarine -
C /var/games/home/.config/sway/config 0644 ultramarine ultramarine - /usr/share/tg5050/sway-config

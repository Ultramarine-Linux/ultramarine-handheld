# TG5050 RetroArch skeleton defaults.
# Seeded into fresh ~/.config/retroarch/retroarch.cfg on first launch.
# Source template: /home/ultramarine/.config/retroarch/retroarch.cfg from the
# live device (3377 lines, trimmed here to image deltas only).
# Full template saved in scratch during bring-up; do not paste the full dump
# here — let Fedora defaults own everything else.
core_updater_buildbot_cores_url = "https://buildbot.libretro.com/nightly/linux/aarch64/latest/"
core_updater_buildbot_assets_url = "https://buildbot.libretro.com/assets/"
assets_directory = "/usr/share/libretro/assets/"
content_database_path = "/usr/share/libretro/database/rdb/"
cheat_database_path = "/usr/share/libretro/database/cht/"
core_assets_directory = "/var/games/retroarch/downloads"
libretro_directory = "/var/games/retroarch/cores"
# Mutable game data lives under /var (writable on the immutable image).
# ROMs go in /var/games/roms (browser root stays /var/games).
rgui_browser_directory = "/var/games"
savefile_directory = "/var/games/saves"
savestate_directory = "/var/games/states"
system_directory = "/var/games/retroarch/system"
screenshot_directory = "/var/games/screenshots"
thumbnails_directory = "/var/games/retroarch/thumbnails"
recording_output_directory = "/var/games/records"
recording_config_directory = "/var/games/records_config"
# Save layout: saves and states sorted by content directory (one folder per
# ROM folder, usually per platform).
sort_savefiles_enable = "false"
sort_savefiles_by_content_enable = "true"
sort_savestates_enable = "false"
sort_savestates_by_content_enable = "true"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
video_driver = "gl"
menu_driver = "ozone"
audio_driver = "pipewire"
audio_latency = "64"
audio_out_rate = "48000"
input_driver = "sdl2"
input_joypad_driver = "sdl2"
# TG5050 buttons: hotkey on btn 5, menu via gamepad combo 4, full device
# gamepad map. Synced from the live device 2026-09-26.
input_enable_hotkey_btn = "5"
input_menu_toggle_btn = "nul"
input_menu_toggle_gamepad_combo = "4"
input_player1_analog_dpad_mode = "1"
input_player1_a_btn = "1"
input_player1_b_btn = "0"
input_player1_x_btn = "3"
input_player1_y_btn = "2"
input_player1_up_btn = "11"
input_player1_down_btn = "12"
input_player1_left_btn = "13"
input_player1_right_btn = "14"
input_player1_l_btn = "9"
input_player1_r_btn = "10"
input_player1_l2_axis = "+4"
input_player1_l2_btn = "nul"
input_player1_r2_btn = "nul"
input_player1_l3_btn = "7"
input_player1_r3_btn = "8"
input_player1_select_btn = "4"
input_player1_start_btn = "6"
input_player1_l_x_minus_axis = "-0"
input_player1_l_x_plus_axis = "+0"
input_player1_l_y_minus_axis = "-1"
input_player1_l_y_plus_axis = "+1"
input_player1_r_x_minus_axis = "-2"
input_player1_r_x_plus_axis = "+2"
input_player1_r_y_minus_axis = "-3"
input_player1_r_y_plus_axis = "+3"
menu_show_advanced_settings = "true"
gamemode_enable = "true"

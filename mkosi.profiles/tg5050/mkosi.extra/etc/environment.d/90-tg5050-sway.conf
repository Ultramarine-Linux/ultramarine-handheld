# Static environment shared by Sway and its user-session applications.
# This appliance has one fixed Wayland socket name; SWAYSOCK remains dynamic
# and is imported by the Sway config when the session starts.
XDG_SESSION_TYPE=wayland
XDG_SESSION_DESKTOP=sway
XDG_CURRENT_DESKTOP=sway
MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM=wayland
SDL_VIDEODRIVER=wayland
_JAVA_AWT_WM_NONREPARENTING=1

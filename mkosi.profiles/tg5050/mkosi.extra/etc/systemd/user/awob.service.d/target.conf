[Service]
# The target's unprivileged user manager cannot apply the packaged
# capability/user-namespace sandbox. Keep awob functional in the Wayland
# session; the daemon and listeners remain confined to the user service.
NoNewPrivileges=no
ProtectSystem=off
ProtectHome=off
PrivateTmp=no
ProtectKernelTunables=no
ProtectKernelLogs=no
ProtectControlGroups=no
RestrictNamespaces=no
RestrictSUIDSGID=no
LockPersonality=no
MemoryDenyWriteExecute=no

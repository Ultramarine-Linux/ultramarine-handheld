# TG5050 idle profile: pin the known board clocks to their minimums.
# This profile is used only while the graphical workload is frozen.

[main]
summary=Minimum TG5050 idle clocks

[cpu]
governor=powersave
energy_perf_bias=powersave|power
energy_performance_preference=power
boost=0

[sysfs]
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=408000
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=408000
/sys/devices/system/cpu/cpufreq/policy4/scaling_min_freq=408000
/sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq=408000
/sys/class/devfreq/1800000.gpu/min_freq=400000000
/sys/class/devfreq/1800000.gpu/max_freq=400000000
/sys/class/devfreq/3120000.dmcfreq/min_freq=150000000
/sys/class/devfreq/3120000.dmcfreq/max_freq=150000000


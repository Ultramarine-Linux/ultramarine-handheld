# Fedora balanced-battery profile with TG5050 dynamic DDR scaling.

[main]
summary=Balanced profile biased towards power savings changes for battery
include=balanced

[cpu]
energy_performance_preference=balance_power
boost=1

[video]
panel_power_savings=1

[sysfs]
/sys/class/devfreq/3120000.dmcfreq/governor=simple_ondemand

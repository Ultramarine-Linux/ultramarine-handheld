# TrimUI Smart Pro S / A527 ALSA policy for WirePlumber 0.5.
# The vendor codec has no useful desktop UCM profile.

monitor.alsa.properties = {
  alsa.reserve = false
  alsa.midi = false
  alsa.midi.monitoring = true
  vm.node.defaults = {
    api.alsa.period-size = 256
    api.alsa.headroom = 8192
  }
}

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.alsa.use-ucm = false
        api.alsa.soft-mixer = true
        api.acp.auto-profile = false
        api.acp.auto-port = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*" }
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        api.alsa.card.0.device = "audiocodec"
        api.alsa.soft-mixer = true
        alsa.mixer.control = "Master"
        alsa.mixer.device = "audiocodec"
        alsa.mixer.invert-volume = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output._sys_devices_platform_soc_3000000_soc_3000000_codec_mach_sound_card0.playback.0.0"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-mmap = true
        api.alsa.soft-mixer = true
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]

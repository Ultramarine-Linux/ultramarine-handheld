[Output]
ImageId=tg5050-panfrost
Format=directory
Output=ultramarine-tg5050-panfrost
OutputDirectory=../../build

[Content]
# These are the userspace dependencies of the Panfrost extension. The
# pack-panfrost-sysext helper adds the matching kmod-panfrost RPM payload.
Packages=
    mesa-dri-drivers
    mesa-filesystem
    mesa-libEGL
    mesa-libGL
    mesa-libgbm
    mesa-vulkan-drivers
    libglvnd
    libglvnd-egl
    libglvnd-gles
    libglvnd-glx
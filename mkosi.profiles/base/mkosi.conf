[Output]
ImageId=base

# Board-agnostic appliance plumbing shared by every handheld profile.
# Board profiles (e.g. tg5050) layer their wiring on top; boot-stack
# overlays (e.g. tg5050-mainline) come last and own the final ImageId.

[Boot]
Bootable=no
Bootloader=none

[Content]
PostInstallationScripts=scripts/mkosi.postinst.chroot
FinalizeScripts=scripts/mkosi.finalize.chroot

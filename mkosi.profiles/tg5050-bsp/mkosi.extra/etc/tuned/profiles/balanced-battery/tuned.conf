# TG5050 BSP balanced-battery profile with vendor activity-monitor governors.

[main]
summary=Balanced profile biased towards power savings changes for battery
include=balanced

[cpu]
energy_performance_preference=balance_power
boost=1

[video]
panel_power_savings=1

[sysfs]
/sys/class/devfreq/1800000.gpu/governor=simple_ondemand
/sys/class/devfreq/3120000.dmcfreq/governor=sunxi_actmon

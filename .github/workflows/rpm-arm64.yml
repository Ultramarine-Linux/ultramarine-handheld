name: ARM64 RPM builds

on:
  push:
    paths:
      - "packaging/rpm/**"
      - "packaging/rpm-builder/**"
      - "packaging/rpm-builder-uboot/**"
      - "packaging/rpm-builder-firmware/**"
      - ".github/workflows/rpm-arm64.yml"
  pull_request:
    paths:
      - "packaging/rpm/**"
      - "packaging/rpm-builder/**"
      - "packaging/rpm-builder-uboot/**"
      - "packaging/rpm-builder-firmware/**"
      - ".github/workflows/rpm-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: arm64-rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: kernel-tg5050 (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: "sccache gcc"
      HOSTCC: "sccache gcc"
      HOSTCXX: "sccache g++"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install kernel build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/kernel/kernel-tg5050.spec

      - name: Build kernel RPMs with Andaman
        run: |
          anda build -rrpmbuild packaging/rpm/kernel

      - name: Show kernel sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Locate kernel build artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload kernel RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tg5050-rpms-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

  bsp-custom:
    name: kernel-tg5050-bsp-custom (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: "sccache gcc"
      HOSTCC: "sccache gcc"
      HOSTCXX: "sccache g++"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install BSP custom kernel build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/bsp-custom/kernel-tg5050-bsp-custom.spec

      - name: Build BSP custom kernel RPMs with Andaman
        run: |
          anda build -rrpmbuild packaging/rpm/bsp-custom

      - name: Show BSP custom kernel sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Locate BSP custom kernel build artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload BSP custom kernel RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tg5050-bsp-custom-rpms-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

  uboot:
    name: uboot-images-tg5050 (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: "sccache gcc"
      HOSTCC: "sccache gcc"
      HOSTCXX: "sccache g++"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install U-Boot build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/uboot/uboot-images-tg5050.spec

      - name: Build U-Boot RPM with Andaman
        run: |
          anda build -rrpmbuild packaging/rpm/uboot

      - name: Locate U-Boot build artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload U-Boot RPM and boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uboot-images-tg5050-rpms-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

  firmware:
    name: aic8800-firmware (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install firmware build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/firmware/aic8800-firmware.spec

      - name: Build AIC8800 firmware RPM with Andaman
        run: |
          anda build -rrpmbuild packaging/rpm/firmware

      - name: Locate firmware build artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload AIC8800 firmware RPM
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-firmware-rpm-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

  bsp:
    name: kernel-tg5050-bsp (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Build BSP kernel and module RPMs with Andaman
        run: |
          anda build -rrpmbuild --rpm-target aarch64 packaging/rpm/bsp

      - name: Locate BSP build artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload BSP kernel RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tg5050-bsp-rpms-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

  kmod-panfrost:
    name: kmod-panfrost (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install Panfrost kmod build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/kmod-panfrost/kmod-panfrost.spec

      - name: Build Panfrost kmod RPM with Andaman
        run: |
          anda build -rrpmbuild --rpm-target aarch64 packaging/rpm/kmod-panfrost

      - name: Locate Panfrost kmod artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload Panfrost kmod RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kmod-panfrost-rpms-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

  marina-cage:
    name: marina-cage (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install marina-cage build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/marina-cage/marina-cage.spec

      - name: Build marina-cage RPM with Andaman
        run: |
          anda build -rrpmbuild packaging/rpm/marina-cage

      - name: Locate marina-cage artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload marina-cage RPMs
        uses: actions/upload-artifact@v4
        with:
          name: marina-cage-rpms-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

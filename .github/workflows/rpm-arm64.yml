name: ARM64 RPM builds

on:
  push:
    paths:
      - "packaging/rpm/**"
      - "packaging/rpm-builder/**"
      - "packaging/rpm-builder-uboot/**"
      - "packaging/rpm-builder-firmware/**"
      - ".github/workflows/rpm-arm64.yml"
  pull_request:
    paths:
      - "packaging/rpm/**"
      - "packaging/rpm-builder/**"
      - "packaging/rpm-builder-uboot/**"
      - "packaging/rpm-builder-firmware/**"
      - ".github/workflows/rpm-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: kernel-tg5050 (Fedora ARM64 mkosi)
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/terrapkg/builder:f44
    timeout-minutes: 180
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install mkosi and host tools
        run: |
          dnf install --assumeyes systemd-container curl git python3
          git clone --depth=1 https://github.com/systemd/mkosi.git "$RUNNER_TEMP/mkosi"
          ln -sf "$RUNNER_TEMP/mkosi/bin/mkosi" /usr/local/bin/mkosi
          mkosi --version

      - name: Prefetch RPM sources
        run: |
          set -eux
          mkdir -p build/rpm-sources
          curl --fail --location --retry 3 \
            -o build/rpm-sources/v7.2-rc3.tar.gz \
            https://github.com/torvalds/linux/archive/refs/tags/v7.2-rc3.tar.gz
          curl --fail --location --retry 3 \
            -o build/rpm-sources/634e03ab964fbeab5395248038c518d8e27688b7.tar.gz \
            https://github.com/MidG971/trimui_mainline_dts/archive/634e03ab964fbeab5395248038c518d8e27688b7.tar.gz

      - name: Build kernel RPMs in Fedora ARM64 mkosi
        run: |
          mkosi --directory=packaging/rpm-builder \
            --incremental=yes --force build

      - name: Upload kernel RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tg5050-rpms-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/rpm-output/*.rpm
            build/rpm-output/*.buildinfo
            build/rpm-output/*.src.rpm

  uboot:
    name: uboot-images-tg5050 (Fedora ARM64 mkosi)
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/terrapkg/builder:f44
    timeout-minutes: 120
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install mkosi and host tools
        run: |
          dnf install --assumeyes systemd-container curl git python3
          git clone --depth=1 https://github.com/systemd/mkosi.git "$RUNNER_TEMP/mkosi"
          ln -sf "$RUNNER_TEMP/mkosi/bin/mkosi" /usr/local/bin/mkosi
          mkosi --version

      - name: Prefetch RPM sources
        run: |
          set -eux
          mkdir -p build/rpm-sources
          curl --fail --location --retry 3 \
            -o build/rpm-sources/e354b34a6ab4b1887fd451bea8ceb7be146070a8.tar.gz \
            https://github.com/u-boot/u-boot/archive/e354b34a6ab4b1887fd451bea8ceb7be146070a8.tar.gz
          curl --fail --location --retry 3 \
            -o build/rpm-sources/e019f64d91ff7c2dfbbfe7f76a14f240761b9edc.tar.gz \
            https://github.com/jernejsk/arm-trusted-firmware/archive/e019f64d91ff7c2dfbbfe7f76a14f240761b9edc.tar.gz

      - name: Build U-Boot RPM in Fedora ARM64 mkosi
        run: |
          mkosi --directory=packaging/rpm-builder-uboot \
            --incremental=yes --force build

      - name: Upload U-Boot RPM and boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uboot-images-tg5050-rpms-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/rpm-output/*.rpm
            build/rpm-output/*.buildinfo
            build/rpm-output/*.src.rpm

  firmware:
    name: aic8800-firmware (Fedora ARM64 mkosi)
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/terrapkg/builder:f44
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install mkosi and host tools
        run: |
          dnf install --assumeyes systemd-container curl git python3
          git clone --depth=1 https://github.com/systemd/mkosi.git "$RUNNER_TEMP/mkosi"
          ln -sf "$RUNNER_TEMP/mkosi/bin/mkosi" /usr/local/bin/mkosi
          mkosi --version

      - name: Prefetch firmware source
        run: |
          set -eux
          mkdir -p build/rpm-sources
          curl --fail --location --retry 3 \
            -o build/rpm-sources/aic8800-batocera-ccba7fffed8554fe861bd631ff6f852d2d6eec39.tar.gz \
            https://github.com/batocera-linux/aic8800/archive/ccba7fffed8554fe861bd631ff6f852d2d6eec39.tar.gz

      - name: Build AIC8800 firmware RPM in Fedora ARM64 mkosi
        run: |
          mkosi --directory=packaging/rpm-builder-firmware \
            --incremental=yes --force build

      - name: Upload AIC8800 firmware RPM
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-firmware-rpm-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/rpm-output/aic8800-firmware-*.rpm
            build/rpm-output/*.buildinfo

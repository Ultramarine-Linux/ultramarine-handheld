name: ARM64 RPM builds

on:
  push:
    paths:
      - "packaging/rpm/**"
      - "packaging/rpm-builder/**"
      - "packaging/rpm-builder-uboot/**"
      - "packaging/rpm-builder-firmware/**"
      - ".github/workflows/rpm-arm64.yml"
  pull_request:
    paths:
      - "packaging/rpm/**"
      - "packaging/rpm-builder/**"
      - "packaging/rpm-builder-uboot/**"
      - "packaging/rpm-builder-firmware/**"
      - ".github/workflows/rpm-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: arm64-rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: kernel-tg5050 (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: "sccache gcc"
      HOSTCC: "sccache gcc"
      HOSTCXX: "sccache g++"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install kernel build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/kernel/kernel-tg5050.spec

      - name: Verify sccache compiler wrapper
        run: |
          command -v sccache
          sccache --version
          compiler="$(command -v gcc || command -v cc)"
          cxx_compiler="$(command -v g++ || command -v c++)"
          printf 'C compiler: %s\nC++ compiler: %s\n' "$compiler" "$cxx_compiler"
          "$compiler" --version
          echo "SCCACHE_CC=$compiler" >> "$GITHUB_ENV"
          echo "SCCACHE_CXX=$cxx_compiler" >> "$GITHUB_ENV"
          sccache --zero-stats
          printf 'int main(void) { return 0; }\n' | sccache "$compiler" -x c -c -o /tmp/sccache-probe.o -
          sccache --show-stats

      - name: Build kernel RPMs with Andaman
        run: |
          env \
            CC="sccache ${SCCACHE_CC}" \
            HOSTCC="sccache ${SCCACHE_CC}" \
            HOSTCXX="sccache ${SCCACHE_CXX}" \
            SCCACHE_GHA_ENABLED="${SCCACHE_GHA_ENABLED}" \
            anda build -rrpmbuild packaging/rpm/kernel

      - name: Show kernel sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Locate kernel build artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload kernel RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tg5050-rpms-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

  uboot:
    name: uboot-images-tg5050 (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: "sccache gcc"
      HOSTCC: "sccache gcc"
      HOSTCXX: "sccache g++"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install U-Boot build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/uboot/uboot-images-tg5050.spec

      - name: Build U-Boot RPM with Andaman
        run: |
          anda build -rrpmbuild packaging/rpm/uboot

      - name: Locate U-Boot build artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload U-Boot RPM and boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uboot-images-tg5050-rpms-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

  firmware:
    name: aic8800-firmware (Andaman RPM)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/terrapkg/builder:f44
      options: --privileged
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          dnf install --assumeyes dnf-plugins-core git python3

      - name: Install firmware build dependencies
        run: |
          dnf builddep --assumeyes packaging/rpm/firmware/aic8800-firmware.spec

      - name: Build AIC8800 firmware RPM with Andaman
        run: |
          anda build -rrpmbuild packaging/rpm/firmware

      - name: Locate firmware build artifacts
        run: |
          find anda-build -type f \
            \( -name '*.rpm' -o -name '*.buildinfo' -o -name '*.src.rpm' \) \
            -print 2>/dev/null || true

      - name: Upload AIC8800 firmware RPM
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-firmware-rpm-${{ github.sha }}
          if-no-files-found: error
          path: anda-build/

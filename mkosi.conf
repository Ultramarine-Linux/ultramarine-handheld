[Distribution]
Distribution=fedora
Release=44
Architecture=arm64
Repositories=ultramarine

[Output]
Format=directory
Output=ultramarine-rootfs
OutputDirectory=build

[Content]
RootPassword=root
Packages=
    systemd
    systemd-pam
    systemd-resolved
    systemd-udev
    systemd-networkd
    NetworkManager
    NetworkManager-wifi
    dnsmasq
    wpa_supplicant
    openssh-server
    bash
    coreutils
    util-linux
    iproute
    iputils
    kmod
    procps-ng
    findutils
    grep
    sed
    gawk
    tar
    gzip
    xz
    zstd
    less
    nano
    passwd
    shadow-utils
    dbus-broker
    policycoreutils
    ca-certificates
    dnf5
    rpm
    sudo
    terra-gpg-keys
    ultramarine-gpg-keys
    terra-release
    ultramarine-release
    ultramarine-release-common
    ultramarine-repos
    e2fsprogs
    weston
    kmscon
    libdrm
    wayland-utils
    kmscube
    linuxconsoletools
    pipewire
    pipewire-alsa
    pipewire-pulseaudio
    wireplumber
    alsa-utils
# The target keeps the vendor kernel, DTB, boot package, and U-Boot.
# Do not install Fedora kernels or standard bootloader packages yet.
PrepareScripts=mkosi.prepare
ExtraTrees=overlay
ExtraTrees=board/trimui-smart-pro-s/inputd
ExtraTrees=board/trimui-smart-pro-s/audio

[Build]
SandboxTrees=
    mkosi.sandbox/etc/dnf/dnf.conf:/etc/dnf/dnf.conf
    repodir/terra.repo:/etc/yum.repos.d/terra.repo
    repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo
Incremental=yes
BuildDirectory=build/rootfs-build-cache
CacheDirectory=build/rootfs-package-cache

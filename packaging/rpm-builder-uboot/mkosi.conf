[Distribution]
Distribution=fedora
Release=44
Architecture=arm64

[Output]
Format=none
OutputDirectory=../../build/rpm-output

[Build]
BuildSources=../../packaging/rpm:src/rpm
             ../../build/rpm-sources:src/downloads
             ../../build/rpm-output:src/output
BuildSourcesEphemeral=no
Incremental=yes
CacheDirectory=../../build/rpm-cache-uboot

[Distribution]
Distribution=fedora
Release=44
Architecture=arm64
Repositories=ultramarine

[Output]
Format=directory
Output=ultramarine-rootfs
OutputDirectory=build

[Content]
RootPassword=root
Packages=
    systemd
    systemd-pam
    systemd-resolved
    systemd-udev
    systemd-networkd

    tuned
    mangohud
    zram-generator-defaults
    lm_sensors
    NetworkManager
    NetworkManager-wifi
    dnsmasq
    wpa_supplicant
    openssh-server
    bash
    bash-completion
    coreutils
    util-linux
    iproute
    iputils
    kmod
    procps-ng
    python3
    findutils
    grep
    sed
    gawk
    tar
    gzip
    xz
    zstd
    unzip
    squashfuse
    bc
    less
    nano
    passwd
    shadow-utils
    dbus-broker
    policycoreutils
    ca-certificates
    dnf5
    rpm
    sudo
    terra-gpg-keys
    ultramarine-gpg-keys
    terra-release
    ultramarine-release
    ultramarine-release-common
    ultramarine-repos
    ultramarine-backgrounds
    e2fsprogs
    weston
    kmscon
    libdrm
    wayland-utils
    kmscube

    openal-soft
    SDL3
    sdl2-compat
    SDL2_image
    SDL2_mixer
    SDL2_net
    SDL2_sound
    umu-launcher
    python3-pyzstd
    python3-urllib3
    python3-xlib
    awob
    sway
    swaybg
    xorg-x11-server-Xwayland
    foot
    zellij
    google-noto-sans-mono-fonts
    google-noto-emoji-fonts
    dejavu-sans-mono-fonts
    wlr-randr
    wtype
    brightnessctl
    linuxconsoletools
    pipewire
    pipewire-alsa
    pipewire-pulseaudio
    wireplumber
    alsa-utils
    upower
RemovePackages=PackageKit
# Board-specific vendor inputs, overlays, and hooks are selected by a
# profile under mkosi.profiles/ (currently: tg5050).
# Do not install Fedora kernels or standard bootloader packages yet.

[Build]
SandboxTrees=
    mkosi.sandbox/etc/dnf/dnf.conf:/etc/dnf/dnf.conf
    repodir/terra.repo:/etc/yum.repos.d/terra.repo
    repodir/ultramarine.repo:/etc/yum.repos.d/ultramarine.repo
Incremental=yes
BuildDirectory=build/rootfs-build-cache
CacheDirectory=build/rootfs-package-cache
